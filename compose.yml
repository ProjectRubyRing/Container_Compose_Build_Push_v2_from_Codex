# docker compose build でローカルベースイメージ j1/base.local を生成するための定義。
#   $ docker compose -f compose.yml build
# 生成後、build_and_push.sh が j1/base.local を ECR 用にタグ付けしてプッシュする。
#
# JBoss のマスターパスワードは environment 型の BuildKit シークレットとして渡す。
# build_and_push.sh / build_and_verify.sh が環境変数 JBOSS_MASTER_PASSWORD を
# export してからビルドする (シークレット不使用時は空文字が入る)。
# スクリプトを使わず手動でビルドする場合は、環境変数を定義してから実行すること:
#   $ JBOSS_MASTER_PASSWORD=... docker compose -f compose.yml build
#
# CA 証明書は file 型の BuildKit シークレットとして渡す。
# build_and_push.sh / build_and_verify.sh の --cacert-dir で指定した各ディレクトリ
# (例: secrets/extraslb, secrets/others1, secrets/others2) の cacert.crt を 1 つの
# tar へまとめ、その tar のパスを環境変数 CACERT_BUNDLE_FILE へ export してから
# ビルドする。スクリプトを使わず手動でビルドする場合は、事前に tar を作って
# 環境変数を定義すること:
#   $ tar -cf /tmp/cacerts-bundle.tar -C secrets extraslb others1 others2
#   $ CACERT_BUNDLE_FILE=/tmp/cacerts-bundle.tar docker compose -f compose.yml build
services:
  base:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - jboss_master_password
        - cacerts
    # ここで指定した名前がローカルベースイメージ名になる（要件: j1/base.local）
    image: j1/base.local

secrets:
  # environment 型シークレット: 環境変数 JBOSS_MASTER_PASSWORD の値を、ビルド中
  # のみ /run/secrets/jboss_master_password として参照できる (RUN --mount=type=secret)。
  # イメージのレイヤ・履歴・環境変数には残らない。
  jboss_master_password:
    environment: JBOSS_MASTER_PASSWORD
  # file 型シークレット: CA 証明書をまとめた tar を、ビルド中のみ
  # /run/secrets/cacerts として参照できる。中身は <提供元名>/<ファイル名>
  # (例: extraslb/cacert.crt) で、提供元が増えてもここの定義と Dockerfile の
  # RUN --mount 行は 1 つのままでよい (BuildKit のシークレットはディレクトリを
  # マウントできないため、tar 1 ファイルに詰めて渡す)。
  # CACERT_BUNDLE_FILE が未設定のときは /dev/null (= 中身なし) となり、証明書を
  # 使わない従来どおりのビルドになる。スクリプト経由のビルドでは、--cacert-dir を
  # 指定しない場合も「空の tar」のパスが必ず入る。
  cacerts:
    file: ${CACERT_BUNDLE_FILE:-/dev/null}
